name: HMM Options Daily Runner

on:
  schedule:
    # Runs Monday through Friday at 21:30 UTC (4:30 PM EST / 5:30 PM EDT)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-hmm-model:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to commit and push the SQLite database back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy scikit-learn hmmlearn matplotlib

      - name: Run HMM Options Script
        run: |
          python your_script_name.py  # Replace with your actual Python script filename

      - name: Commit and Push Updated SQLite Database
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Check if the SQLite database was modified or created
          if git status --porcelain | grep -q "hmm_sandbox.db"; then
            git add hmm_sandbox.db
            git commit -m "Automated log update: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
